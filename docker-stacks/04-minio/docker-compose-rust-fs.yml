version: '3.7'

x-default-opts: 
  &default-opts
  logging:
    options:
      max-size: "${SIMVA_LOGGING_MAX_FILE_SIZE}"
      max-file: "${SIMVA_LOGGING_MAX_FILES}"

networks:
  traefik_services:
    name: "${SIMVA_SERVICE_NETWORK:-traefik_services}"
    external: true

services:
  rustfs:
    << : *default-opts
    image: ${SIMVA_RUSTFS_IMAGE:-rustfs/rustfs}:${SIMVA_RUSTFS_VERSION:-1.0.0}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - minio_data:/data/rustfs
      - ${SIMVA_TLS_HOME?TLS home folder required}/ca:/opt/tls
      - ${SIMVA_CONTAINER_TOOLS_HOME:-/home/vagrant/docker-stacks/container-tools}:/container-tools
      - ${SIMVA_BIN_HOME:-/home/vagrant/simva-infra/docker-stacks/bin}/wait-available.sh:/bin/wait-available.sh:ro
    environment:
      RUSTFS_VOLUMES: /data/rustfs
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      # S3 API CORS. Unset means RustFS answers with no CORS headers at all,
      # which breaks the presigned trace uploads performed by the browser.
      # Browser origins allowed to call the RustFS S3 API directly.
      # The SIMVA front end uploads study traces straight to RustFS using the presigned
      # URLs handed out by the SIMVA API, so the S3 listener must accept that origin.
      # RustFS emits NO CORS headers when this is empty, so it cannot be left unset.
      # Comma separated list. Use * only for public resources: wildcard does not allow
      # credentialed browser requests.
      RUSTFS_CORS_ALLOWED_ORIGINS: "https://${SIMVA_EXTERNAL_DOMAIN}"
      RUSTFS_ACCESS_KEY: "${SIMVA_RUSTFS_ACCESS_KEY:-minio}"
      RUSTFS_SECRET_KEY: "${SIMVA_RUSTFS_SECRET_KEY:-secret}"
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_BROWSER_REDIRECT_URL: "https://${SIMVA_RUSTFS_HOST_SUBDOMAIN:-rustfs}.${SIMVA_EXTERNAL_DOMAIN:-external.test}"
      RUSTFS_SERVER_URL: "https://${SIMVA_RUSTFS_API_HOST_SUBDOMAIN:-rustfs-api}.${SIMVA_EXTERNAL_DOMAIN:-external.test}"
      #RUSTFS_TLS_PATH: /opt/tls
      RUSTFS_OBS_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-rustfs.cluster.id=rustfs-dev}
      # Region reported to S3 clients. The notify bucket rules are validated
      # against arn:rustfs:sqs:<region>:<instance>:<target>, so this value and
      # the region used in the notification rule ARN (see the 05-kafka
      # after-start hook) must stay in sync.
      RUSTFS_REGION: "${SIMVA_RUSTFS_REGION:-us-east-1}"
      # Bucket event notifications are disabled unless the notify module is
      # explicitly enabled.
      RUSTFS_NOTIFY_ENABLE: "true"
      # Kafka event queue destination. Every key of a target MUST carry the same
      # _<INSTANCE> suffix: a suffix-less key is parsed as the "_" default entry,
      # which only supplies defaults to named instances and never creates a
      # target on its own. The target name is the lowercased suffix, so _SIMVA
      # registers the instance "simva" with ARN
      # arn:rustfs:sqs:${RUSTFS_REGION}:simva:kafka.
      # The queue dir must be writable by the runtime user (uid 10001); the
      # default /opt/rustfs/events does not exist in the image.
      RUSTFS_NOTIFY_KAFKA_ENABLE_SIMVA: "on"
      RUSTFS_NOTIFY_KAFKA_BROKERS_SIMVA: "kafka1.${SIMVA_INTERNAL_DOMAIN:-internal.test}:19092"
      RUSTFS_NOTIFY_KAFKA_TOPIC_SIMVA: "${SIMVA_MINIO_EVENTS_TOPIC:-minio-events}"
      RUSTFS_NOTIFY_KAFKA_QUEUE_DIR_SIMVA: "${SIMVA_RUSTFS_NOTIFY_QUEUE_DIR:-/data/rustfs/events}"
      RUSTFS_NOTIFY_KAFKA_QUEUE_LIMIT_SIMVA: "${SIMVA_RUSTFS_NOTIFY_QUEUE_LIMIT:-100000}"
      WAIT_TIMEOUT: ${SIMVA_WAIT_TIMEOUT:-240}
      SIMVA_WAIT_TIME: ${SIMVA_WAIT_TIME:-10}
      SIMVA_MAX_RETRIES: ${SIMVA_MAX_RETRIES:-20}
    restart: unless-stopped
    healthcheck:
      test: "curl -sS http://localhost:9000/minio/health/live || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
    hostname: ${SIMVA_RUSTFS_HOST_SUBDOMAIN:-rustfs}.${SIMVA_INTERNAL_DOMAIN:-internal.test}
    networks:
      default:
        aliases:
          - ${SIMVA_RUSTFS_HOST_SUBDOMAIN:-rustfs}.${SIMVA_INTERNAL_DOMAIN:-internal.test}
      traefik_services:
        aliases:
          - ${SIMVA_RUSTFS_HOST_SUBDOMAIN:-rustfs}.${SIMVA_INTERNAL_DOMAIN:-internal.test}
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.rustfs-ui-service.loadbalancer.server.port=9001"
      - "traefik.http.routers.rustfs-ui.service=rustfs-ui-service"
      - "traefik.http.routers.rustfs-ui.rule=Host(`${SIMVA_RUSTFS_HOST_SUBDOMAIN:-rustfs}.${SIMVA_EXTERNAL_DOMAIN:-external.test}`)"
      - "traefik.http.services.rustfs-api-service.loadbalancer.server.port=9000"
      - "traefik.http.routers.rustfs-api.service=rustfs-api-service"
      - "traefik.http.routers.rustfs-api.rule=Host(`${SIMVA_RUSTFS_API_HOST_SUBDOMAIN:-rustfs-api}.${SIMVA_EXTERNAL_DOMAIN:-external.test}`)"

volumes:
  minio_data:
    external: true
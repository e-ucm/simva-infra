version: '3.7'

x-default-opts: 
  &default-opts
  logging:
    options:
      max-size: "${SIMVA_LOGGING_MAX_FILE_SIZE}"
      max-file: "${SIMVA_LOGGING_MAX_FILES}"
  # driver: "gelf"
  # options:
  #   gelf-address: "udp://127.0.0.1:5000"

services:
  simva-api:
    build: 
      context: ${SIMVA_API_GIT_REPO:-/home/vagrant/simva}
      target: dev
    restart: unless-stopped
    environment:
      LOG_LEVEL: "debug"
      XASUJS_LOCAL_DEPLOYMENT: "${SIMVA_XASUJS_LIBRARY_LOCAL_DEPLOYMENT}"
      XASUJS_LOCAL_PATH: "/xasu-js"
      XASUJS_ENTRYPOINT_SCRIPT: "/home/node/entrypoint.d/setup-local-deps.js"
    volumes:
      - ${SIMVA_API_GIT_REPO:-/home/vagrant/simva}:/app/
      - ${SIMVA_XASUJS_LIBRARY_LOCAL_PATH:-/home/vagrant/xasu-js}:/xasu-js
      - /xasu-js/node_modules  # Exclude node_modules
      - /app/node_modules  # Exclude node_modules
      - ${STACK_HOME?STACK home folder required}/etc/entrypoint.d/setup-local-deps.js:/home/node/entrypoint.d/setup-local-deps.js
    ports:
      - "127.0.0.1:9229:9229"
      - "127.0.0.1:9232:9230"
  simva-front:
    build: 
      context: ${SIMVA_FRONT_GIT_REPO:-/home/vagrant/simva-front}
      target: dev
    restart: unless-stopped
    environment:
      LOG_LEVEL: "debug"
      XASUJS_LOCAL_DEPLOYMENT: "${SIMVA_XASUJS_LIBRARY_LOCAL_DEPLOYMENT}"
      XASUJS_LOCAL_PATH: "/xasu-js"
      XASUJS_ENTRYPOINT_SCRIPT: "/home/node/entrypoint.d/setup-local-deps.js"
    volumes:
      - ${SIMVA_FRONT_GIT_REPO:-/home/vagrant/simva-front}:/app/
      - ${SIMVA_XASUJS_LIBRARY_LOCAL_PATH:-/home/vagrant/xasu-js}:/xasu-js
      - /xasu-js/node_modules  # Exclude node_modules
      - /app/node_modules  # Exclude node_modules
      - ${STACK_HOME?STACK home folder required}/etc/entrypoint.d/setup-local-deps.js:/home/node/entrypoint.d/setup-local-deps.js
    ports:
      - "127.0.0.1:9230:9229"
      - "127.0.0.1:9233:9230"
  simva-trace-allocator:
    build: 
      context: ${SIMVA_TRACE_ALLOCATOR_GIT_REPO:-/home/vagrant/simva-trace-allocator}
      target: dev
    restart: unless-stopped
    environment:
      LOG_LEVEL: "debug"
    volumes:
      - ${SIMVA_TRACE_ALLOCATOR_GIT_REPO:-/home/vagrant/simva-trace-allocator}:/app/
      - /app/node_modules  # Exclude node_modules
    ports:
      - "127.0.0.1:9231:9229"
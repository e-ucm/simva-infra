name: simva-smoke

on:
  push:
    branches: [rustfs, main]
  pull_request:
    branches: [rustfs, main]
  workflow_dispatch:

concurrency:
  group: simva-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: SIMVA ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [development, production, development-local]
    timeout-minutes: 360
    env:
      SIMVA_ENV: ${{ matrix.environment == 'development-local' && 'development' || matrix.environment }}
      # development-local: SIMVA_DEVELOPMENT_LOCAL=true and the default CHANGEME1234 secrets are kept
      SIMVA_LOCAL_DEFAULTS: ${{ matrix.environment == 'development-local' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq curl git unzip dos2unix apache2-utils default-jre-headless libnss3-tools
          curl -fsSL -o /tmp/mkcert \
            https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64
          sudo install -m 0755 /tmp/mkcert /usr/local/bin/mkcert
          mkcert -version

      - name: Configure SIMVA environment
        shell: bash
        working-directory: docker-stacks
        run: |
          # real env files are untracked: create them from the templates
          for t in etc/simva.install.d/simva-env.example.sh etc/simva.install.d/simva-env.dev.example.sh; do
            cp "$t" "etc/simva.d/$(basename "${t/.example/}")"
          done
          # replace every default CHANGEME1234 with a random alphanumeric password
          for f in etc/simva.d/simva-env.sh etc/simva.d/simva-env.dev.sh; do
            [[ "$SIMVA_LOCAL_DEFAULTS" == "true" ]] && break
            while grep -q CHANGEME1234 "$f"; do
              pw=$(openssl rand -hex 16)
              sed -i "0,/CHANGEME1234/s//$pw/" "$f"
            done
          done
          sed -i 's|^export SIMVA_ENVIRONMENT="development"|export SIMVA_ENVIRONMENT="'"$SIMVA_ENV"'"|' etc/simva.d/simva-env.sh
          sed -i 's|^export SIMVA_TLS_GENERATE_SELF_SIGNED="false"|export SIMVA_TLS_GENERATE_SELF_SIGNED="true"|' etc/simva.d/simva-env.sh
          if [[ "$SIMVA_LOCAL_DEFAULTS" == "true" ]]; then
            # local dev must work with the default secrets
            grep -q '^export SIMVA_DEVELOPMENT_LOCAL="true"' etc/simva.d/simva-env.dev.sh
            grep -q CHANGEME1234 etc/simva.d/simva-env.sh
          elif [[ "$SIMVA_ENV" == "development" ]]; then
            sed -i 's|^export SIMVA_DEVELOPMENT_LOCAL="true"|export SIMVA_DEVELOPMENT_LOCAL="false"|' etc/simva.d/simva-env.dev.sh
          fi
          grep -nE 'SIMVA_ENVIRONMENT|SIMVA_TLS_GENERATE_SELF_SIGNED|SIMVA_DEVELOPMENT_LOCAL' etc/simva.d/simva-env*.sh

      - name: Enable local deployment
        if: env.SIMVA_LOCAL_DEFAULTS == 'true'
        shell: bash
        working-directory: docker-stacks
        run: |
          # SIMVA_DEVELOPMENT_LOCAL=true expects the sources next to simva-infra (${SIMVA_HOME}/../..);
          # the before-start checkout hooks of each stack clone the missing ones, using
          # the SIMVA_*_VERSION tags (SIMVA_XASUJS_GIT_REF otherwise).
          # sed -i -E 's/^export (SIMVA_(KEYCLOAK_EXTENSION|KAFKA_EXTENSION|LIMESURVEY_PLUGIN|XASUJS_LIBRARY)_LOCAL_DEPLOYMENT)=.*/export \1=true/' etc/simva.d/simva-env.dev.sh
          grep -n 'LOCAL_DEPLOYMENT' etc/simva.d/simva-env.dev.sh

      - name: Populate /etc/hosts for external.test subdomains
        shell: bash
        working-directory: docker-stacks
        run: |
          sudo bash "$GITHUB_WORKSPACE/scripts/ci/setup-hosts.sh"
          grep 'external.test' /etc/hosts

      - name: Install SIMVA
        shell: bash
        working-directory: docker-stacks
        timeout-minutes: 180
        run: sudo env "PATH=$PATH" ./simva install

      - name: Create base Docker networks and volumes
        shell: bash
        working-directory: docker-stacks
        run: |
          sudo env "PATH=$PATH" ./simva start 00-network
          bash "$GITHUB_WORKSPACE/scripts/ci/create-external-resources.sh"

      - name: Start SIMVA
        shell: bash
        working-directory: docker-stacks
        timeout-minutes: 240
        run: sudo env "PATH=$PATH" ./simva start 00-network 01-traefik 02-logs 03-keycloak 04-limesurvey 05-rustfs 06-kafka 07-shlink 11-lrs 20-simva 21-tmon

      - name: Verify SIMVA services
        shell: bash
        working-directory: docker-stacks
        timeout-minutes: 30
        run: bash "$GITHUB_WORKSPACE/scripts/ci/simva-verify.sh" "$SIMVA_ENV"

      - name: Collect diagnostics
        if: failure()
        shell: bash
        working-directory: docker-stacks
        run: |
          mkdir -p "$GITHUB_WORKSPACE/diag-$SIMVA_ENV"
          {
            echo "### docker ps -a"
            docker ps -a
          } > "$GITHUB_WORKSPACE/diag-$SIMVA_ENV/containers.txt" || true
          {
            echo "### docker compose ls"
            docker compose ls
          } > "$GITHUB_WORKSPACE/diag-$SIMVA_ENV/compose.txt" || true
          for stack in 01-traefik 02-logs 03-keycloak 04-limesurvey 05-rustfs 06-kafka 07-shlink 11-lrs 20-simva 21-tmon ; do
            sudo env "PATH=$PATH" ./simva log "$stack" > "$GITHUB_WORKSPACE/diag-$SIMVA_ENV/$stack.log" 2>&1 || true
          done

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: simva-smoke-${{ matrix.environment }}-diag
          path: diag-${{ matrix.environment }}/
          if-no-files-found: ignore

      - name: Stop SIMVA
        if: always()
        shell: bash
        working-directory: docker-stacks
        run: sudo env "PATH=$PATH" ./simva uninstall

  upgrade-test:
    name: SIMVA upgrade test
    runs-on: ubuntu-latest
    #needs: smoke
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq curl git unzip dos2unix apache2-utils default-jre-headless libnss3-tools
          curl -fsSL -o /tmp/mkcert \
            https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64
          sudo install -m 0755 /tmp/mkcert /usr/local/bin/mkcert
          mkcert -version

      - name: Configure SIMVA environment
        shell: bash
        working-directory: docker-stacks
        run: |
          for t in etc/simva.install.d/simva-env.example.sh etc/simva.install.d/simva-env.dev.example.sh; do
            cp "$t" "etc/simva.d/$(basename "${t/.example/}")"
          done
          for f in etc/simva.d/simva-env.sh etc/simva.d/simva-env.dev.sh; do
            while grep -q CHANGEME1234 "$f"; do
              pw=$(openssl rand -hex 16)
              sed -i "0,/CHANGEME1234/s//$pw/" "$f"
            done
          done
          sed -i 's|^export SIMVA_ENVIRONMENT="development"|export SIMVA_ENVIRONMENT="development"|' etc/simva.d/simva-env.sh
          sed -i 's|^export SIMVA_TLS_GENERATE_SELF_SIGNED="false"|export SIMVA_TLS_GENERATE_SELF_SIGNED="true"|' etc/simva.d/simva-env.sh

      - name: Populate /etc/hosts
        shell: bash
        working-directory: docker-stacks
        run: |
          sudo bash "$GITHUB_WORKSPACE/scripts/ci/setup-hosts.sh"

      - name: Setup previous version for upgrade test
        shell: bash
        working-directory: docker-stacks
        run: |
          export SIMVA_HOME="${PWD}"
          export SIMVA_STACKS="00-network 01-traefik 02-logs 03-keycloak 04-limesurvey 05-rustfs 06-kafka 07-shlink 11-lrs 20-simva 21-tmon"
          cp etc/simva.install.d/simva-env.sh etc/simva.install.d/simva-env.sh.bak
          for stack in $SIMVA_STACKS; do
            VFILE="${SIMVA_HOME}/${stack}/etc/upgrade/versions.txt"
            if [ ! -f "$VFILE" ]; then
              echo "No versions.txt for $stack, skipping"
              continue
            fi
            sed -i 's/\r$//' "$VFILE"
            HEADER=$(head -n1 "$VFILE")
            IFS='|' read -ra NAMES <<< "$HEADER"
            # get first name
            FIRST_NAME="${NAMES[0]}"
            # convert to env var name
            VAR_NAME="SIMVA_$(echo ${FIRST_NAME} | tr '[:lower:]' '[:upper:]')_VERSION"
            # get all versions except header (sorted ascending)
            VERSION=$(tail -n +2 "$VFILE" |
              sed '/^[[:space:]]*$/d' |
              sort -t'|' -k1,1 -V |
              awk -F'|' 'NR==1 {print $1}')
            # current version for this stack (must be known before the loop below)
            CUR_VER=$(grep "^export ${VAR_NAME}=" etc/simva.install.d/simva-env.sh | cut -d'"' -f2 || true)
            echo "Current: $CUR_VER, First version: $VERSION"
            if [ -z "$VERSION" ]; then
              # no previous version available: keep the actual current version
              VERSION="$CUR_VER"
            fi
            echo "Setting $VAR_NAME to $VERSION"
            # update in simva.install.d/simva-env.sh (replace if present, append otherwise)
            if grep -q "^export ${VAR_NAME}=" etc/simva.install.d/simva-env.sh; then
              sed -i "s|^export ${VAR_NAME}=\".*\"|export ${VAR_NAME}=\"${VERSION}\"|" etc/simva.install.d/simva-env.sh
            else
              echo "export ${VAR_NAME}=\"${VERSION}\"" >> etc/simva.install.d/simva-env.sh
            fi
            grep "^export ${VAR_NAME}=" etc/simva.install.d/simva-env.sh || true
          done

      - name: Create base Docker networks and volumes
        shell: bash
        working-directory: docker-stacks
        run: |
          sudo env "PATH=$PATH" ./simva start 00-network
          bash "$GITHUB_WORKSPACE/scripts/ci/create-external-resources.sh"

      - name: Install and start with previous version
        shell: bash
        working-directory: docker-stacks
        timeout-minutes: 240
        run: |
          sudo env "PATH=$PATH" ./simva start

      - name: Upgrade to current version
        shell: bash
        working-directory: docker-stacks
        timeout-minutes: 240
        run: |
          export SIMVA_HOME="${PWD}"
          cp etc/simva.install.d/simva-env.sh.bak etc/simva.install.d/simva-env.sh
          sudo env "PATH=$PATH" ./simva restart --auto-upgrade

      - name: Verify after upgrade
        shell: bash
        working-directory: docker-stacks
        timeout-minutes: 60
        run: bash "$GITHUB_WORKSPACE/scripts/ci/simva-verify.sh" development

      - name: Stop SIMVA
        if: always()
        shell: bash
        working-directory: docker-stacks
        run: sudo env "PATH=$PATH" ./simva uninstall || sudo env "PATH=$PATH" ./simva purge || true
